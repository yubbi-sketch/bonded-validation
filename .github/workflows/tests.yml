name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  forge-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exp3/contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: forge test
        run: forge test -vv
